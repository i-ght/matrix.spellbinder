[package]
name = "spellbinder"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3.1"
rand = "0.9.0"
ruma = { version = "0.12.1", features = ["client-api", "rand"] }
ruma-client = { version = "0.15.0", features = ["client-api", "hyper-native-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
